
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050805"/>
      <stop offset="1" stop-color="#0D160D"/>
    </linearGradient>

    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14" stop-opacity=".85"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#39FF14" stroke-opacity=".055"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#background)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <rect x="1" y="1" width="1198" height="338" rx="17"
        fill="none" stroke="#39FF14" stroke-opacity=".25"/>

  <rect x="0" y="0" width="1200" height="4" rx="2" fill="#39FF14"/>

  <!-- Terminal chrome -->
  <circle cx="32" cy="30" r="5" fill="#39FF14"/>
  <circle cx="50" cy="30" r="5" fill="#39FF14" fill-opacity=".45"/>
  <circle cx="68" cy="30" r="5" fill="#39FF14" fill-opacity=".2"/>

  <text x="90" y="34" fill="#8CA18C" font-family="monospace" font-size="12">
    firaol@github: ~/developer-profile
  </text>

  <text x="1160" y="34" fill="#39FF14" text-anchor="end"
        font-family="monospace" font-size="11">
    SESSION ACTIVE
  </text>

  <line x1="24" y1="52" x2="1176" y2="52" stroke="#39FF14" stroke-opacity=".16"/>

  <!-- Identity -->
  <text x="64" y="100" fill="#39FF14" font-family="monospace" font-size="13">
    &gt; WHOAMI
  </text>

  <text x="60" y="166" fill="#F0FFF0" font-family="monospace"
        font-size="58" font-weight="700" letter-spacing="-3">
    FIRAOL
  </text>

  <text x="60" y="224" fill="#F0FFF0" font-family="monospace"
        font-size="58" font-weight="700" letter-spacing="-3">
    TEGENE
  </text>

  <rect x="64" y="246" width="290" height="3" fill="url(#signal)"/>

  <text x="64" y="278" fill="#39FF14" font-family="monospace" font-size="16">
    FULL-STACK DEVELOPER
  </text>

  <text x="64" y="304" fill="#8CA18C" font-family="monospace" font-size="12">
    SOFTWARE ENGINEERING  /  ETHIOPIA
  </text>

  <!-- Right-side telemetry -->
  <rect x="760" y="78" width="370" height="210" rx="10"
        fill="#0A100A" stroke="#39FF14" stroke-opacity=".2"/>

  <text x="784" y="108" fill="#39FF14" font-family="monospace" font-size="12">
    SYSTEM TELEMETRY
  </text>

  <line x1="784" y1="122" x2="1106" y2="122" stroke="#39FF14" stroke-opacity=".2"/>

  <text x="784" y="153" fill="#789078" font-family="monospace" font-size="12">
    ENGINEERING
  </text>
  <text x="1106" y="153" fill="#E7F5E7" text-anchor="end"
        font-family="monospace" font-size="12">
    FULL-STACK
  </text>

  <text x="784" y="183" fill="#789078" font-family="monospace" font-size="12">
    FOCUS
  </text>
  <text x="1106" y="183" fill="#E7F5E7" text-anchor="end"
        font-family="monospace" font-size="12">
    SOFTWARE + AI
  </text>

  <text x="784" y="213" fill="#789078" font-family="monospace" font-size="12">
    MODE
  </text>
  <text x="1106" y="213" fill="#39FF14" text-anchor="end"
        font-family="monospace" font-size="12">
    BUILDING
  </text>

  <!-- Signal bars -->
  <g transform="translate(784 240)" fill="#39FF14" filter="url(#glow)">
    <rect x="0" y="20" width="8" height="12" opacity=".25"/>
    <rect x="14" y="14" width="8" height="18" opacity=".4"/>
    <rect x="28" y="7" width="8" height="25" opacity=".6"/>
    <rect x="42" y="0" width="8" height="32" opacity=".9"/>
    <rect x="56" y="10" width="8" height="22" opacity=".65"/>
    <rect x="70" y="17" width="8" height="15" opacity=".4"/>
    <rect x="84" y="5" width="8" height="27" opacity=".8"/>
    <rect x="98" y="13" width="8" height="19" opacity=".5"/>
  </g>

  <text x="1106" y="266" fill="#789078" text-anchor="end"
        font-family="monospace" font-size="10">
    BUILD // LEARN // ITERATE
  </text>

  <text x="1136" y="318" fill="#39FF14" fill-opacity=".55"
        text-anchor="end" font-family="monospace" font-size="10">
    FIRAOL.TEG / 001
  </text>
</svg>
